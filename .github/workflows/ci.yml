name: ci

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci
      
      - name: Executar Lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: lacrei-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Iniciar container
        run: |
          docker run -d \
            --name lacrei-api \
            -p 3000:3000 \
            lacrei-api:latest
      
      - name: Health Check
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:3000/status; then
              echo "API saudável!"
              exit 0
            fi

            echo "Aguardando aplicação iniciar..."
            sleep 2
          done

          echo "A aplicação não iniciou a tempo."
          docker logs lacrei-api
          exit 1

      - name: Parar container
        if: always()
        run: docker stop lacrei-api || true && docker rm -f lacrei-api || true